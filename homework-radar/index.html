<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework Radar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650;9..144,760&family=Public+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar" aria-label="App overview">
        <div>
          <p class="eyebrow">Homework Radar</p>
          <h1>Today’s homework, pulled from school email.</h1>
        </div>
        <div class="account-card" aria-label="Connected account">
          <span class="status-dot"></span>
          <div>
            <strong>Gmail connected</strong>
          </div>
        </div>
      </section>

      <section class="briefing" aria-label="Parent briefing">
        <div class="briefing-copy">
          <span class="pill urgent">Parent morning brief</span>
          <h2 id="briefingTitle">Assignments</h2>
          <p id="briefingText">I found due dates in Google Classroom emails and listed them below.</p>
        </div>
        <div class="metrics" aria-label="Assignment counts">
          <div>
            <strong id="totalCount">0</strong>
            <span>Total</span>
          </div>
        </div>
      </section>

      <section class="controls" aria-label="Assignment controls">
        <div class="filter-row" role="group" aria-label="Class filters">
          <button class="filter active" data-filter="All" type="button">All</button>
          <button class="filter" data-filter="Math" type="button">Math</button>
          <button class="filter" data-filter="English" type="button">English</button>
          <button class="filter" data-filter="Science" type="button">Science</button>
          <button class="filter" data-filter="World History" type="button">History</button>
        </div>
      </section>

      <section class="workspace" aria-label="Assignments">
        <aside class="timeline" aria-label="Upcoming days">
          <h2>Due dates</h2>
          <div id="timelineList"></div>
        </aside>

        <section class="assignment-panel">
          <div class="panel-header">
            <div>
              <h2>Assignments</h2>
              <p id="panelSubcopy">Sorted by what needs attention first.</p>
            </div>
          </div>
          <div id="assignmentList" class="assignment-list"></div>
        </section>
      </section>
    </main>

    <template id="assignmentTemplate">
      <article class="assignment-card">
        <div class="assignment-main">
          <div class="assignment-meta">
            <span class="class-chip"></span>
            <span class="due-chip"></span>
          </div>
          <h3></h3>
          <p></p>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
